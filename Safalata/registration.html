<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <script src="nav.js"defer></script>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div>
        <center>
            <p style="font-size:80px; color: #0e065c;margin-bottom: 0px; margin-top: 30px;">
                Registration Form
            </p>
            <img src="images/Screenshot 2026-10-11 203807.png" width="750px">
            <div class="form">
                <label>Name:</label>
                <input type="text" name="name">
                <br>
                <br>
                <label>Email:</label>
                <input type="email" name="email">
                <br>
                <br>
                <label>Phone No.:</label>
                <input type="tel" name="phone">
                <br>
                <br>
                <label>Password:</label>
                <input type="password" name="password">
                <br>
                <br>
                <label>Confirm Password:</label>
                <input type="password" name="confirm_password">
                <br>
                <br>
                <button class="reg-btn" type="submit" style="font-size : 20px; padding: 10px 30px;">Submit</button>
            </div>
            <p style="font-size: 30px; margin-top: 0px;">
                Already have an account? <a href="login.html" style="color: #0e065c;">Login</a>
            </p>
        </center>
    </div>
</body>
</html>
